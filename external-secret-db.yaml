# Reemplaza a secret_db.yaml: External Secrets Operator lee "db-password" del
# Key Vault y crea el Secret nativo "db-secret" que ya consume dp-back.yaml.
#
# Prerrequisitos (los crea `terraform apply` en este mismo folder):
#   - ESO instalado en el cluster (namespace external-secrets)
#   - Secret "azure-kv-sp" con ClientID/ClientSecret del Service Principal
#
# Los placeholders se renderizan al desplegar:
#   eval "$(terraform output -raw apply_external_secret_command)"
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv
  namespace: default
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      tenantId: "__TENANT_ID__"
      vaultUrl: "__KEY_VAULT_URL__"
      authSecretRef:
        clientId:
          name: azure-kv-sp
          key: ClientID
        clientSecret:
          name: azure-kv-sp
          key: ClientSecret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: SecretStore
  target:
    name: db-secret
    creationPolicy: Owner
  data:
  - secretKey: DB_PASSWORD
    remoteRef:
      key: db-password
      # En Key Vault está en base64 (main.tf); ESO lo decodifica para que el
      # pod reciba la contraseña real en DB_PASSWORD.
      decodingStrategy: Base64
